name: COCO S6X vs CMA-ES Head-to-Head

# Push-triggered execution is intentional (same pattern as coco-head-to-head.yml):
# it provides a GitHub-native way to launch the full deterministic benchmark when
# manual dispatch is unavailable.
on:
  workflow_dispatch:
  push:
    branches: ["main", "coco-head-to-head"]
    paths:
      - '.github/workflows/coco-s6x-head-to-head.yml'
      - 'benchmarks/coco_head_to_head/**'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  s6x-head-to-head:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.14'
          cache: 'pip'
          cache-dependency-path: benchmarks/coco_head_to_head/requirements.lock

      - name: Install pinned dependencies
        working-directory: benchmarks/coco_head_to_head
        run: |
          python -m pip install --upgrade "pip==25.2"
          python -m pip install -r requirements.lock

      - name: Verify benchmark stack
        run: |
          python --version
          python - <<'PY'
          import cma, cocoex, cocopp, numpy, sys
          print('python=', sys.version.split()[0])
          print('cocoex=', cocoex.__version__)
          print('cocopp=', cocopp.__version__)
          print('cma=', cma.__version__)
          print('numpy=', numpy.__version__)
          assert cocoex.__version__ == '2.8.2'
          assert cocopp.__version__ == '2.8.8'
          assert cma.__version__ == '4.4.4'
          assert numpy.__version__ == '2.2.6'
          PY

      - name: Run S6X head-to-head pass 1
        working-directory: benchmarks/coco_head_to_head
        run: |
          rm -rf COCO_S6X_HEAD_TO_HEAD exdata
          python s6x_head_to_head.py | tee ../../s6x_head_to_head_run1.txt
          cp -a COCO_S6X_HEAD_TO_HEAD ../../COCO_S6X_HEAD_TO_HEAD_RUN1
          cp -a exdata ../../COCO_S6X_EXDATA_RUN1

      - name: Run S6X head-to-head pass 2
        working-directory: benchmarks/coco_head_to_head
        run: |
          rm -rf COCO_S6X_HEAD_TO_HEAD exdata
          python s6x_head_to_head.py | tee ../../s6x_head_to_head_run2.txt

      - name: Verify deterministic replay
        run: |
          set -euo pipefail
          cmp -s s6x_head_to_head_run1.txt s6x_head_to_head_run2.txt
          cmp -s COCO_S6X_HEAD_TO_HEAD_RUN1/S6X/results.json benchmarks/coco_head_to_head/COCO_S6X_HEAD_TO_HEAD/S6X/results.json
          cmp -s COCO_S6X_HEAD_TO_HEAD_RUN1/CMA_ES/results.json benchmarks/coco_head_to_head/COCO_S6X_HEAD_TO_HEAD/CMA_ES/results.json
          cmp -s COCO_S6X_HEAD_TO_HEAD_RUN1/comparison.json benchmarks/coco_head_to_head/COCO_S6X_HEAD_TO_HEAD/comparison.json
          echo 'S6X_HEAD_TO_HEAD_DETERMINISM=PASS'

      - name: Postprocess official COCO data
        working-directory: benchmarks/coco_head_to_head
        run: |
          python -m cocopp -o COCO_S6X_HEAD_TO_HEAD/ppdata exdata/S6X_H2H_S6X exdata/S6X_H2H_CMA

      - name: Build comparison certificate
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('benchmarks/coco_head_to_head/COCO_S6X_HEAD_TO_HEAD')
          comp = json.loads((root / 'comparison.json').read_text())
          cert = {
              'suite': 'bbob',
              'dimension': 10,
              'budget': 1000,
              'seed': 20260810,
              'problem_count': comp['problem_count'],
              'classification_counts': comp['counts'],
              's6x_success_rate': comp['s6x_final_target_success_rate'],
              'cma_success_rate': comp['cma_final_target_success_rate'],
              'head_to_head_claims': {
                  'S6X_ONLY': 'observed S6X final-target successes where CMA-ES did not succeed within the benchmark budget',
                  'CMA_ONLY': 'observed CMA-ES final-target successes where S6X did not succeed within the benchmark budget',
                  'BOTH': 'both algorithms reached the final target; evaluation counts are retained for runtime comparison',
                  'NEITHER': 'neither algorithm reached the final target within the benchmark budget'
              },
              'scope': 'reference is the repo harness CMA-ES (popsize=10, sigma0=0.3, single run, no restart); not a claim vs tuned BIPOP-CMA-ES',
              's6x_results_sha256': hashlib.sha256((root / 'S6X' / 'results.json').read_bytes()).hexdigest(),
              'cma_results_sha256': hashlib.sha256((root / 'CMA_ES' / 'results.json').read_bytes()).hexdigest(),
              'comparison_sha256': hashlib.sha256((root / 'comparison.json').read_bytes()).hexdigest()
          }
          (root / 'comparison_certificate.json').write_text(json.dumps(cert, indent=2, sort_keys=True) + '\n')
          print(json.dumps(cert, indent=2, sort_keys=True))
          PY

      - name: Capture provenance
        if: always()
        run: |
          mkdir -p COCO_S6X_HEAD_TO_HEAD_EVIDENCE/provenance
          git rev-parse HEAD > COCO_S6X_HEAD_TO_HEAD_EVIDENCE/provenance/git_commit.txt
          python --version > COCO_S6X_HEAD_TO_HEAD_EVIDENCE/provenance/python_version.txt
          python -m pip freeze > COCO_S6X_HEAD_TO_HEAD_EVIDENCE/provenance/pip_freeze.txt
          sha256sum benchmarks/coco_head_to_head/s6x_head_to_head.py > COCO_S6X_HEAD_TO_HEAD_EVIDENCE/provenance/s6x_harness.sha256
          sha256sum benchmarks/coco_head_to_head/s6x.py > COCO_S6X_HEAD_TO_HEAD_EVIDENCE/provenance/s6x_algo.sha256
          sha256sum benchmarks/coco_head_to_head/requirements.lock > COCO_S6X_HEAD_TO_HEAD_EVIDENCE/provenance/requirements.sha256
          cp benchmarks/coco_head_to_head/COCO_S6X_HEAD_TO_HEAD/comparison.json COCO_S6X_HEAD_TO_HEAD_EVIDENCE/comparison.json || true
          cp benchmarks/coco_head_to_head/COCO_S6X_HEAD_TO_HEAD/comparison_certificate.json COCO_S6X_HEAD_TO_HEAD_EVIDENCE/comparison_certificate.json || true

      - name: Upload official evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coco-s6x-vs-cma-head-to-head
          path: |
            benchmarks/coco_head_to_head/COCO_S6X_HEAD_TO_HEAD/
            COCO_S6X_HEAD_TO_HEAD_RUN1/
            COCO_S6X_EXDATA_RUN1/
            benchmarks/coco_head_to_head/exdata/
            s6x_head_to_head_run1.txt
            s6x_head_to_head_run2.txt
            COCO_S6X_HEAD_TO_HEAD_EVIDENCE/
            benchmarks/coco_head_to_head/s6x_head_to_head.py
            benchmarks/coco_head_to_head/s6x.py
            benchmarks/coco_head_to_head/requirements.lock
          if-no-files-found: warn