name: AGD × SV-COMP 2026 Compatible Experiment (MAX)

on:
  workflow_dispatch:
    inputs:
      max_tasks:
        description: "Synthetic official-style tasks (determinism substrate)"
        required: true
        default: "64"
      stress_count:
        description: "Deterministic stress/replay iterations (maximize within runner)"
        required: true
        default: "25000"
      workers:
        description: "Process workers for stress (0 = auto)"
        required: true
        default: "0"

permissions:
  contents: read

concurrency:
  group: agd-svcomp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agd-svcomp-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout ChronoFold
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install official BenchExec + dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install benchexec pyyaml
          python -c "import benchexec; print('BenchExec', getattr(benchexec, '__version__', 'installed'))"

      - name: Phase 0 — Environment Audit
        run: |
          set -euo pipefail
          mkdir -p artifacts/agd_svcomp
          python tools/agd_svcomp/phase0_environment.py > artifacts/agd_svcomp/environment.json
          python -c "
          import hashlib, pathlib
          p = pathlib.Path('artifacts/agd_svcomp/environment.json')
          h = hashlib.sha256(p.read_bytes()).hexdigest()
          p.with_suffix('.json.sha256').write_text(h + '\n')
          print('environment.json.sha256 =', h)
          "

      - name: Phase 1 — Fetch official material (shallow)
        run: |
          set -euo pipefail
          mkdir -p external/svcomp
          cd external/svcomp
          git clone --depth 1 --branch svcomp26 \
            https://gitlab.com/sosy-lab/sv-comp/bench-defs.git bench-defs || true
          echo '{"note": "Full sv-benchmarks skipped (size). Tag svcomp26 recorded.", "bench_defs_tag": "svcomp26"}' > corpus_status.json
          if [ -d bench-defs ]; then
            (cd bench-defs && git rev-parse HEAD) > bench-defs.commit
            echo "bench-defs HEAD: $(cat bench-defs.commit)"
          else
            echo "unavailable" > bench-defs.commit
          fi

      - name: Phase 2 — Official task count + SOTA reference
        run: |
          set -euo pipefail
          cat > artifacts/agd_svcomp/official_task_reference.json << 'EOF'
          {
            "source": "SV-COMP 2026 competition report (public literature)",
            "c_tasks": 36402,
            "java_tasks": 1731,
            "total_c_java": 38133,
            "sv_lib_tasks": 254,
            "note": "Full enumeration NOT EXECUTED. Published official counts only."
          }
          EOF

      - name: Phase 3–7 — Maximum-strength AGD projection + stress
        run: |
          set -euo pipefail
          MAX_TASKS="${{ github.event.inputs.max_tasks || '64' }}"
          STRESS="${{ github.event.inputs.stress_count || '25000' }}"
          WORKERS="${{ github.event.inputs.workers || '0' }}"
          if [ "$WORKERS" = "0" ]; then
            WORKERS=$(( $(nproc) / 2 ))
            [ "$WORKERS" -lt 1 ] && WORKERS=1
          fi
          echo "Running with max_tasks=$MAX_TASKS stress=$STRESS workers=$WORKERS"
          python tools/agd_svcomp/run_agd_svcomp_harness.py \
            --max-tasks "$MAX_TASKS" \
            --stress-count "$STRESS" \
            --workers "$WORKERS" \
            --out-dir artifacts/agd_svcomp

      - name: Phase 10 — Final certificate
        run: |
          set -euo pipefail
          python tools/agd_svcomp/make_certificate.py \
            --artifact-dir artifacts/agd_svcomp \
            --out artifacts/agd_svcomp/agd_svcomp2026_certificate.json
          python -c "
          import hashlib, pathlib
          p = pathlib.Path('artifacts/agd_svcomp/agd_svcomp2026_certificate.json')
          h = hashlib.sha256(p.read_bytes()).hexdigest()
          p.with_suffix('.json.sha256').write_text(h + '\n')
          print('FINAL CERTIFICATE SHA256 =', h)
          "

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agd-svcomp-2026-max-artifacts
          path: |
            artifacts/agd_svcomp/
            external/svcomp/
          if-no-files-found: warn

      - name: Print required final summary
        if: always()
        run: |
          set -euo pipefail
          if [ -f artifacts/agd_svcomp/SUMMARY.txt ]; then
            cat artifacts/agd_svcomp/SUMMARY.txt
          else
            echo "SUMMARY.txt missing"
          fi
