name: Build Signed Flutter APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/flutter.yml'
      - 'chronofold_app/**'
    branches: [ "main" ]

permissions:
  contents: read

env:
  RELEASE_APK_PATH: chronofold_app/build/app/outputs/flutter-apk/app-release.apk
  DEBUG_APK_PATH: chronofold_app/build/app/outputs/flutter-apk/app-debug.apk
  SIGNED_APK_NAME: chronofold-signed-release.apk
  DEBUG_APK_NAME: chronofold-debug.apk

jobs:
  build-signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create app scaffold if missing
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "chronofold_app" ]; then
            flutter create --org com.chronofold --project-name chronofold_app chronofold_app
          fi

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd chronofold_app
          flutter pub get
          # http is optional; ignore if already present or constrained
          flutter pub add http || true

      - name: Prepare Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          # PKCS12 (Java default) requires identical store + key passwords.
          # Prefer a single shared password when secrets are absent.
          DEFAULT_PASS="chronofold-ci-pass"
          STORE_PASS="${ANDROID_KEYSTORE_PASSWORD:-$DEFAULT_PASS}"
          KEY_PASS="${ANDROID_KEY_PASSWORD:-$STORE_PASS}"
          # Force match for generated keystores to avoid padding errors
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            KEY_PASS="$STORE_PASS"
          fi
          ALIAS="${ANDROID_KEY_ALIAS:-chronofold}"

          KEYSTORE_PATH="$RUNNER_TEMP/chronofold-release.jks"

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          else
            keytool -genkeypair \
              -v \
              -storetype PKCS12 \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias "$ALIAS" \
              -dname "CN=ChronoFold CI, OU=ChronoFold, O=ChronoFold, L=Tulsa, ST=Oklahoma, C=US"
          fi

          cat > chronofold_app/android/key.properties <<EOF
          storePassword=$STORE_PASS
          keyPassword=$KEY_PASS
          keyAlias=$ALIAS
          storeFile=$KEYSTORE_PATH
          EOF

          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "STORE_PASS set (length ${#STORE_PASS})"

      - name: Enable release signing in Gradle
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          app_dir = Path('chronofold_app/android/app')
          kts = app_dir / 'build.gradle.kts'
          groovy = app_dir / 'build.gradle'

          if kts.exists():
              path = kts
              text = path.read_text()
              header = '''import java.util.Properties
          import java.io.FileInputStream

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          '''
              if 'val keystoreProperties = Properties()' not in text:
                  text = header + text
              signing = '''
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }
          '''
              if 'create("release")' not in text:
                  text = text.replace('android {', 'android {' + signing, 1)
              text = text.replace(
                  'signingConfig = signingConfigs.getByName("debug")',
                  'signingConfig = signingConfigs.getByName("release")',
              )
              if 'signingConfig = signingConfigs.getByName("release")' not in text:
                  text = re.sub(
                      r'(release\s*\{)',
                      r'\1\n            signingConfig = signingConfigs.getByName("release")',
                      text,
                      count=1,
                  )
              path.write_text(text)
          elif groovy.exists():
              path = groovy
              text = path.read_text()
              header = '''def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          '''
              if 'def keystoreProperties = new Properties()' not in text:
                  text = header + text
              signing = '''
              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                  }
              }
          '''
              if 'signingConfigs {' not in text:
                  text = text.replace('android {', 'android {' + signing, 1)
              text = text.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')
              text = text.replace('signingConfig = signingConfigs.debug', 'signingConfig = signingConfigs.release')
              if 'signingConfig signingConfigs.release' not in text and 'signingConfig = signingConfigs.release' not in text:
                  text = re.sub(
                      r'(release\s*\{)',
                      r'\1\n            signingConfig signingConfigs.release',
                      text,
                      count=1,
                  )
              path.write_text(text)
          else:
              raise SystemExit('No Android Gradle app build file found')
          PY

      - name: Build signed release APK
        id: release_build
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd chronofold_app
          flutter build apk --release

      - name: Build debug APK (always)
        shell: bash
        run: |
          set -euo pipefail
          cd chronofold_app
          flutter build apk --debug

      - name: Validate and package artifacts
        shell: bash
        run: |
          set -euo pipefail

          if [ -s "$DEBUG_APK_PATH" ]; then
            cp "$DEBUG_APK_PATH" "$DEBUG_APK_NAME"
            ls -lh "$DEBUG_APK_NAME"
          else
            echo "ERROR: debug APK missing at $DEBUG_APK_PATH"
            find chronofold_app/build -name '*.apk' -type f 2>/dev/null || true
            exit 1
          fi

          if [ "${{ steps.release_build.outcome }}" = "success" ] && [ -s "$RELEASE_APK_PATH" ]; then
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1 || true)"
            if [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" verify --verbose "$RELEASE_APK_PATH" || true
            fi
            cp "$RELEASE_APK_PATH" "$SIGNED_APK_NAME"
            ls -lh "$SIGNED_APK_NAME"
            echo "HAS_RELEASE=true" >> "$GITHUB_ENV"
          else
            echo "Release build failed or missing; shipping debug APK only."
            echo "HAS_RELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chronofold-apk
          path: chronofold-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed release APK artifact
        if: env.HAS_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chronofold-signed-apk
          path: chronofold-signed-release.apk
          if-no-files-found: warn
          retention-days: 30
