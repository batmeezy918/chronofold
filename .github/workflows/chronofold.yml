name: ChronoFold Verification

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "README.md"
      - ".gitignore"
  pull_request:

permissions:
  contents: write

concurrency:
  group: chronofold-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Lean toolchain
        run: |
          set -euxo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install system dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Prepare directories
        run: |
          set -euxo pipefail
          mkdir -p ChronoFold/Auto theorems_unproven theorems_proven

      - name: Sync dependencies
        run: |
          set -euxo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          git checkout -- lake-manifest.json || true

      - name: Run verification engine
        run: |
          set -euxo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          if [ -f chronofold_ci_engine.sh ]; then
            bash ./chronofold_ci_engine.sh
          elif [ -f archive/old_versions/chronofold_ci_engine.sh ]; then
            bash ./archive/old_versions/chronofold_ci_engine.sh
          else
            echo "chronofold_ci_engine.sh not found; falling back to lake build"
            lake build
          fi

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chronofold-verification-state
          path: |
            build.log
            ChronoFold/Auto/
            theorems_unproven/
            theorems_proven/
          if-no-files-found: warn

      - name: Commit promoted theorems
        if: github.event_name != 'pull_request'
        run: |
          set -euxo pipefail
          git config --global user.name "chronofold-bot"
          git config --global user.email "bot@chronofold.ai"
          git add ChronoFold/Auto theorems_unproven theorems_proven || true
          if git diff --cached --quiet; then
            echo "No staged theorem files to commit"
            exit 0
          fi
          git commit -m "Auto: theorem promotion"
          git push

      - name: Compute Ω
        run: |
          echo "Ω = 1"
