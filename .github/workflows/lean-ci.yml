name: CFPC Lean CI v2

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lean (elan)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          lean --version
          lake --version

      - name: Build project
        run: lake build

      - name: Compile SIM2XR costless logic
        run: lake env lean src/Chronofold/SIM2XR_Universal_Costless_Logic.lean

      - name: Reject unfinished-goal tactics in active Lean source
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --include='*.lean' -E '^[[:space:]]*(sorry|admit)([[:space:]]|$)' src core/src core/CFPC core/theorems_proven; then
            echo PLACEHOLDER_FOUND
            exit 1
          fi
          echo NO_PLACEHOLDERS=1
