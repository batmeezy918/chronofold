name: CFPC Lean CI v2

on:
  push:
  pull_request:

jobs:
  proof-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lean (elan)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Verify toolchain
        run: |
          lean --version
          lake --version

      - name: Build project
        run: |
          lake build

      - name: Audit canonical Verified Theorems manifest
        run: |
          python3 scripts/verify_verified_theorems.py

      - name: Run all Lean files (strict discovery mode)
        shell: bash
        run: |
          set -euo pipefail
          echo "=== STRICT LEAN DISCOVERY MODE ==="
          mapfile -t files < <(find . -name "*.lean" -not -path "./.lake/*" | sort)
          failures=0
          for file in "${files[@]}"; do
            echo "---- RUNNING: $file ----"
            if ! lake env lean "$file"; then
              echo "FAILED: $file"
              failures=$((failures + 1))
            fi
          done
          if [ "$failures" -ne 0 ]; then
            echo "LEAN_DISCOVERY_FAILURES=$failures"
            exit 1
          fi
          echo "LEAN_DISCOVERY_OK=${#files[@]}"

      - name: Reject sorry placeholders in tracked Lean source
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --include='*.lean' --exclude-dir=.lake -E '(^|[^A-Za-z0-9_])sorry([^A-Za-z0-9_]|$)' .; then
            echo "SORRY_PLACEHOLDER_FOUND"
            exit 1
          fi
          echo "NO_SORRY_PLACEHOLDERS=1"

      - name: Generate theorem DAG
        run: |
          echo "=== BUILDING DAG ==="
          mkdir -p cfpc_ci
          find . -name "*.lean" -not -path "./.lake/*" | sort > cfpc_ci/files.txt

          python3 - << 'PY'
import json

files = open("cfpc_ci/files.txt").read().splitlines()
graph = {"nodes": [], "edges": []}
for f in files:
    content = open(f, errors="ignore").read()
    score = 0
    if "theorem" in content:
        score += 2
    if "sorry" in content:
        score -= 5
    if "by" in content:
        score += 1
    graph["nodes"].append({
        "file": f,
        "score": score,
        "has_sorry": "sorry" in content,
    })
with open("cfpc_ci/graph.json", "w") as out:
    json.dump(graph, out, indent=2)
print("DAG generated:", graph)
PY

      - name: Summary report
        run: |
          echo "=== CFPC-CI v2 SUMMARY ==="
          cat cfpc_ci/graph.json
