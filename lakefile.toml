name = "chronofold"
version = "0.1.0"
defaultTargets = ["Chronofold"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.29.0"

[[lean_lib]]
name = "Chronofold"
srcDir = "src"

[[lean_exe]]
name = "Main"
root = "Main"
